<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Leninplatz 1987</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23cc1500'/><text x='32' y='46' font-family='monospace' font-size='28' font-weight='bold' fill='%23ffd700' text-anchor='middle'>LP</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e08;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;font-family:'Courier New',monospace;color:#d4c89a;overflow:hidden;user-select:none;touch-action:none}
canvas{border:3px solid #5a4a28;border-radius:2px;display:block;max-width:100vw;max-height:60dvh;width:auto;height:auto}
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:720px;padding:5px 14px;background:#0a0a06;border:2px solid #5a4a28;border-bottom:none;border-radius:3px 3px 0 0;font-size:0.78rem;letter-spacing:0.08em}
#info{max-width:720px;width:100%;padding:3px 14px;background:#0a0a06;border:2px solid #5a4a28;border-top:1px solid #1e1a0e;border-radius:0 0 3px 3px;font-size:0.62rem;color:#6a5e3a;text-align:center;letter-spacing:0.08em}
.pts-s{color:#d4a820;font-weight:700;font-size:0.82rem}
.pts-p{color:#b0b8b0;font-weight:700;font-size:0.82rem}
#title-bar{color:#c8b060;font-size:0.72rem;text-align:center;flex:1;letter-spacing:0.15em}
#touch-ctrl{display:none;width:100%;max-width:720px;padding:8px 10px;justify-content:space-between;align-items:center}
#tc-left,#tc-right{display:flex;align-items:center;justify-content:center}
.dpad{display:grid;grid-template-columns:repeat(3,clamp(44px,11vw,56px));grid-auto-rows:clamp(44px,11vw,56px);gap:3px}
.dpad>span{display:block}
.tc{background:#1a1408;border:2px solid #5a4a28;border-radius:8px;color:#c8b060;font-family:'Courier New',monospace;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
.dpad .tc{width:100%;height:100%}
.dpad .tc svg{width:55%;height:55%}
.tc-throw svg{width:100%;height:100%}
.tc:active,.tc.on{background:#3a2808;border-color:#c8a030}
.tc-throw{width:90px!important;height:54px!important;border-radius:0!important;padding:2px;
  clip-path:path('M 0,0 Q 45,11 90,0 Q 74,27 90,54 Q 45,43 0,54 Q 16,27 0,0 Z')}
@media(pointer:coarse){#touch-ctrl{display:flex}#info{display:none}canvas{max-height:46dvh}body{justify-content:flex-start}}
@media(pointer:coarse) and (orientation:landscape){
  body{flex-direction:row;overflow:hidden;align-items:center;justify-content:center}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;max-width:none;border-radius:0;border-left:none;border-right:none;font-size:0.6rem;padding:2px 8px}
  canvas{height:calc(100dvh - 28px);width:auto;max-height:calc(100dvh - 28px);max-width:calc(100vw - 240px);border:none;margin-top:28px;flex-shrink:0}
  #touch-ctrl{display:contents!important}
  #tc-left{display:flex!important;order:-1;width:120px;height:100dvh;align-items:center;justify-content:center;flex-shrink:0}
  #tc-right{display:flex!important;order:1;width:120px;height:100dvh;align-items:center;justify-content:center;flex-shrink:0}
  .dpad{grid-template-columns:repeat(3,36px)!important;grid-auto-rows:36px!important;gap:4px!important}
  .tc-throw{width:76px!important;height:46px!important;
    clip-path:path('M 0,0 Q 38,9 76,0 Q 62,23 76,46 Q 38,37 0,46 Q 14,23 0,0 Z')!important}
}
</style>
</head>
<body>
<div id="hud">
  <span class="pts-s">SACHSEN: <span id="scoreS">0</span></span>
  <span id="title-bar">✦ LENINPLATZ 1987 ✦</span>
  <span class="pts-p">PREUSSEN: <span id="scoreP">0</span></span>
</div>
<canvas id="c" width="720" height="400"></canvas>
<div id="info">← → Bewegen &nbsp;|&nbsp; LEERTASTE <svg viewBox="0 0 90 54" fill="none" stroke="currentColor" stroke-linecap="round" style="width:1.8em;height:1.1em;vertical-align:middle"><path stroke-width="2.5" d="M 2,1 Q 45,12 88,1 Q 74,27 88,53 Q 45,42 2,53 Q 16,27 2,1 Z"/><path stroke-width="1.5" d="M 8,7 Q 45,18 82,7"/><path stroke-width="1.5" d="M 8,47 Q 45,36 82,47"/></svg> Werfen &nbsp;/&nbsp; Bestätigen &nbsp;|&nbsp; ↑ Springen &nbsp;|&nbsp; ↓ Ducken</div>
<div id="touch-ctrl">
  <div id="tc-left">
    <div class="dpad">
      <span></span><button class="tc" id="tc-up"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26 L16 7 M8 15 L16 7 L24 15"/></svg></button><span></span>
      <button class="tc" id="tc-l"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M25 16 L7 16 M15 8 L7 16 L15 24"/></svg></button><span></span><button class="tc" id="tc-r"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16 L25 16 M17 8 L25 16 L17 24"/></svg></button>
      <span></span><button class="tc" id="tc-s"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6 L16 25 M8 17 L16 25 L24 17"/></svg></button><span></span>
    </div>
  </div>
  <div id="tc-right">
    <button class="tc tc-throw" id="tc-w"><svg viewBox="0 0 90 54" fill="none" stroke="currentColor" stroke-linecap="round"><path stroke-width="2.5" d="M 2,1 Q 45,12 88,1 Q 74,27 88,53 Q 45,42 2,53 Q 16,27 2,1 Z"/><path stroke-width="1.5" d="M 8,7 Q 45,18 82,7"/><path stroke-width="1.5" d="M 8,47 Q 45,36 82,47"/></svg></button>
  </div>
</div>

<script>
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const W=720, H=400, FLOOR=H-62, WALL_SPLIT=FLOOR-155;

// ── Audio ─────────────────────────────────────────────────────────────────
let _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function playSound(type){
  try{
    const a=ac(),g=a.createGain(),now=a.currentTime;
    g.connect(a.destination);
    const o=()=>{const x=a.createOscillator();x.connect(g);return x;};
    if(type==='pillow'){
      const buf=a.createBuffer(1,a.sampleRate*0.12,a.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*0.025));
      const src=a.createBufferSource();src.buffer=buf;
      const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=350;
      src.connect(lp);lp.connect(g);
      g.gain.setValueAtTime(0.55,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);src.start();
    }else if(type==='abv'){
      // tatütata siren
      const os=o();os.type='sawtooth';
      [880,660,880,660,880,660].forEach((f,i)=>os.frequency.setValueAtTime(f,now+i*0.22));
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+1.4);
      os.start(now);os.stop(now+1.45);
    }else if(type==='hausmeister'){
      const os=o();os.type='triangle';
      os.frequency.setValueAtTime(850,now);os.frequency.exponentialRampToValueAtTime(550,now+0.09);
      g.gain.setValueAtTime(0.45,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
      os.start(now);os.stop(now+0.4);
    }else if(type==='carmen'){
      const os=o();os.type='sine';
      os.frequency.setValueAtTime(480,now);os.frequency.linearRampToValueAtTime(820,now+0.4);os.frequency.linearRampToValueAtTime(620,now+0.8);
      g.gain.setValueAtTime(0.16,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.9);
      os.start(now);os.stop(now+1);
    }else if(type==='teurich'){
      const os=o();os.type='sawtooth';
      const lp=a.createBiquadFilter();lp.type='bandpass';lp.frequency.value=220;lp.Q.value=3;
      os.disconnect();os.connect(lp);lp.connect(g);
      os.frequency.setValueAtTime(110,now);os.frequency.exponentialRampToValueAtTime(55,now+0.55);
      g.gain.setValueAtTime(0.55,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.65);
      os.start(now);os.stop(now+0.7);
    }
  }catch(e){}
}

// ── Keys ─────────────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(state===ST.SPLASH){
    if(e.code==='ArrowLeft'||e.code==='ArrowRight'){humanSide=humanSide==='s'?'p':'s';cpuSide=humanSide==='s'?'p':'s';}
    if(e.code==='Enter'||e.code==='Space'){startGame();}
    e.preventDefault();return;
  }
  if(state===ST.OVER&&(e.code==='Enter'||e.code==='Space')){state=ST.SPLASH;}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>K[e.code]=false);

// Touch controls
['tc-l','tc-r','tc-w','tc-s','tc-up'].forEach(id=>{
  const btn=document.getElementById(id);if(!btn)return;
  const code={'tc-l':'ArrowLeft','tc-r':'ArrowRight','tc-w':'Space','tc-s':'ArrowDown','tc-up':'ArrowUp'}[id];
  btn.addEventListener('touchstart',e=>{
    K[code]=true;btn.classList.add('on');e.preventDefault();
    if(state===ST.SPLASH){
      if(id==='tc-l'||id==='tc-r'){humanSide=id==='tc-l'?'s':'p';cpuSide=humanSide==='s'?'p':'s';}
      return;
    }
  },{passive:false});
  btn.addEventListener('touchend',e=>{
    K[code]=false;btn.classList.remove('on');e.preventDefault();
    if(state===ST.SPLASH&&id==='tc-w'){startGame();}
    if(state===ST.OVER){state=ST.SPLASH;}
  },{passive:false});
});

// Fullscreen on first touch (Android Chrome)
document.addEventListener('touchstart',function fs(){
  const el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  document.removeEventListener('touchstart',fs);
},{once:true,passive:true});

// Canvas tap: select team on splash by tapping left/right half
cv.addEventListener('touchstart',e=>{
  if(state!==ST.SPLASH)return;
  const rect=cv.getBoundingClientRect();
  const tx=(e.touches[0].clientX-rect.left)*(W/rect.width);
  humanSide=tx<W/2?'s':'p';cpuSide=humanSide==='s'?'p':'s';
  e.preventDefault();
},{passive:false});

// Canvas click: select team on splash (desktop mouse)
cv.addEventListener('click',e=>{
  if(state!==ST.SPLASH)return;
  const rect=cv.getBoundingClientRect();
  const tx=(e.clientX-rect.left)*(W/rect.width);
  humanSide=tx<W/2?'s':'p';cpuSide=humanSide==='s'?'p':'s';
});

// ── State ─────────────────────────────────────────────────────────────────
const ST={SPLASH:'splash',PLAY:'play',OVER:'over'};
let state=ST.SPLASH,humanSide='s',cpuSide='p',winner='';

// ── Colors ────────────────────────────────────────────────────────────────
const C={wallHi:'#d0c9b2',wallLoS:'#2a2018',wallLoP:'#1e1e1e',ceiling:'#b8b2a0',floor:'#8a6a40',floorDk:'#6a5030',divide:'#282820'};
const CC={
  s:  {skin:'#f0c898',hair:'#2a1000',shirt:'#111111',pants:'#1e1e14',tie:'#d4a820'},
  p:  {skin:'#e8c090',hair:'#180800',shirt:'#e0ddd5',pants:'#111111',tie:'#111111'},
  abv:{skin:'#f0d8b0',hair:'#1e1e1e',shirt:'#7a7a6a',pants:'#5a5a4a'},
  jan:{skin:'#c89060',hair:'#5a3010',shirt:'#2a5a9a',pants:'#1e3a6e'},
  carmen:{skin:'#f0c8a0',hair:'#101010'},
  teurich:{skin:'#f0c8b0',hair:'#c0392b',shirt:'#9a60c0',pants:'#3a3050'},
};
const WIN_SCORE=40;
const BED_H=32;
const BEDS={s:{x1:55,x2:163},p:{x1:557,x2:665}};
function isOnBed(plr){const b=BEDS[plr.side];return plr.y<=FLOOR-BED_H+4&&plr.x>=b.x1&&plr.x<=b.x2;}

// ── Game objects ──────────────────────────────────────────────────────────
let players,pillows,particles,activeEvent,nextEvent,frame,shake,floodLevel;
let cpuThrowTimer,cpuMoveDir,cpuMoveClock,cpuHideKey=false,eventWarnAge=0;

function startGame(){
  state=ST.PLAY;cpuSide=humanSide==='s'?'p':'s';
  players={
    s:{x:160,y:FLOOR,vx:0,vy:0,onGround:true,dir:1,hiding:0,hideAnim:0,throwCD:0,hitFlash:0,side:'s'},
    p:{x:560,y:FLOOR,vx:0,vy:0,onGround:true,dir:-1,hiding:0,hideAnim:0,throwCD:0,hitFlash:0,side:'p'},
  };
  pillows=[];particles=[];activeEvent=null;floodLevel=0;frame=0;shake=0;
  nextEvent=500+Math.random()*600;
  cpuThrowTimer=80+Math.random()*80;cpuMoveDir=0;cpuMoveClock=0;cpuHideKey=false;
  document.getElementById('scoreS').textContent='0';
  document.getElementById('scoreP').textContent='0';
}

// ── Drawing helpers ───────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke){
  cx.beginPath();cx.roundRect(x,y,w,h,r);
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke();}
}
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}

// ── Room ──────────────────────────────────────────────────────────────────
function drawRoom(){
  cx.imageSmoothingEnabled=false;
  if(_bgImg){cx.drawImage(_bgImg,0,0,W,H);}
  else{cx.fillStyle='#c0b898';cx.fillRect(0,0,W,H);}
  cx.imageSmoothingEnabled=true;

  drawBed(55,FLOOR,'left','#b89820');drawBed(665,FLOOR,'right','#c8c8c0');

  // Wappen an der Wand
  const ww=80,wh=96;
  drawWappenSachsen(W/4-ww/2+64,80,ww,wh);
  drawWappenPreussen(3*W/4-ww/2-56,80,ww,wh);
}

function drawWin(x,y,w,h,cur){
  rr(x,y,w,h,2,'#b8b0a0','#808070');
  px(x+3,y+3,w-6,h-6,'#c8dde8');
  cx.fillStyle='rgba(255,255,255,0.55)';cx.beginPath();cx.arc(x+20,y+22,9,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(x+30,y+20,7,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#808070';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(x+3,y+h/2);cx.lineTo(x+w-3,y+h/2);cx.stroke();
  cx.beginPath();cx.moveTo(x+w/2,y+3);cx.lineTo(x+w/2,y+h-3);cx.stroke();
  cx.fillStyle=cur;cx.globalAlpha=0.35;cx.fillRect(x+3,y+3,10,h-6);cx.fillRect(x+w-13,y+3,10,h-6);cx.globalAlpha=1;
}
function drawBed(x,y,side,col){
  const w=108,h=32,bx=side==='left'?x:x-w;
  const hbx=side==='left'?bx:bx+w-8;
  const fbx=side==='left'?bx+w-8:bx;
  const legH=10;
  cx.imageSmoothingEnabled=false;
  // headboard – gray, no stroke
  cx.fillStyle='#606060';cx.fillRect(hbx,y-h-28,8,34);
  cx.fillStyle='#787878';cx.fillRect(hbx+1,y-h-26,6,26);
  // footboard – gray, no stroke
  cx.fillStyle='#606060';cx.fillRect(fbx,y-h-16,8,22);
  cx.fillStyle='#787878';cx.fillRect(fbx+1,y-h-14,6,14);
  // gray frame body (full height)
  cx.fillStyle='#707070';cx.fillRect(bx,y-h,w,h);
  // darker legs at bottom corners
  cx.fillStyle='#484848';
  cx.fillRect(bx,y-legH,8,legH);
  cx.fillRect(bx+w-8,y-legH,8,legH);
  // mattress – flying pillow color, ends above leg area
  cx.fillStyle='#e8e0ca';cx.fillRect(bx+2,y-h+2,w-4,h-legH-3);
  // blanket fold
  cx.fillStyle='#d4ccb0';cx.fillRect(bx+2,y-h+13,w-4,h-legH-14);
  cx.strokeStyle='#c0b898';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(bx+2,y-h+13);cx.lineTo(bx+w-2,y-h+13);cx.stroke();
  // pillow – flying pillow color
  const px2=side==='left'?bx+10:bx+w-36;
  cx.fillStyle='#e8e0ca';cx.fillRect(px2,y-h+3,26,11);
  cx.strokeStyle='#c0b898';cx.lineWidth=1;cx.strokeRect(px2,y-h+3,26,11);
  cx.imageSmoothingEnabled=true;
}
function drawBanner(x,y,w,bg,tc,lines,fs,icon){
  const lh=Math.ceil(fs*1.3);const iconH=icon?16:0;const h=lines.length*lh+10+iconH;
  cx.fillStyle='rgba(0,0,0,0.35)';cx.fillRect(x+3,y+3,w,h);
  cx.fillStyle=bg;cx.fillRect(x,y,w,h);
  cx.strokeStyle='rgba(255,255,255,0.2)';cx.lineWidth=1.5;cx.strokeRect(x+3,y+3,w-6,h-6);
  cx.strokeStyle='rgba(0,0,0,0.6)';cx.lineWidth=1;cx.strokeRect(x,y,w,h);
  if(icon){cx.font='13px serif';cx.textAlign='center';cx.fillText(icon,x+w/2,y+14);}
  cx.fillStyle=tc;cx.font=`bold ${fs}px 'Courier New',monospace`;cx.textAlign='center';
  lines.forEach((l,i)=>cx.fillText(l,x+w/2,y+iconH+fs+4+i*lh));
  cx.textAlign='left';
}
function drawRadio(x,y){
  px(x-22,y-22,44,20,'#4a3a20');px(x-19,y-20,38,12,'#2a1a08');
  cx.strokeStyle='#3a2a10';cx.lineWidth=0.8;
  for(let r=0;r<5;r++){cx.beginPath();cx.moveTo(x-19,y-19+r*2);cx.lineTo(x,y-19+r*2);cx.stroke();}
  cx.fillStyle='#c8a030';cx.beginPath();cx.arc(x+12,y-14,5,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a0a00';cx.beginPath();cx.arc(x+12,y-14,2,0,Math.PI*2);cx.fill();
}
function drawShelf(x,y){
  px(x,y,60,5,'#5a4020');
  cx.fillStyle='#5a8c10';cx.fillRect(x+8,y-32,8,32); // bottle body – bigger
  cx.fillStyle='#3a6008';cx.fillRect(x+8,y-32,8,32);
  cx.fillStyle='#7ab020';cx.fillRect(x+8,y-38,8,8); // neck
  cx.fillStyle='#c0c0b0';cx.fillRect(x+9,y-40,6,4); // cap
  cx.fillStyle='rgba(220,255,100,0.35)';cx.fillRect(x+9,y-30,6,18);
  cx.fillStyle='#f0e060';cx.font='bold 5px Courier New';cx.textAlign='center';
  cx.fillText('PILSENER',x+12,y-20);cx.textAlign='left';
  [[x+20,'#2a4a6a',22],[x+32,'#4a2a0a',16],[x+40,'#2a3a1a',18]].forEach(([bx,bc,bw])=>{
    px(bx,y-26,bw,26,bc);px(bx+1,y-24,bw-2,2,'#ffffff22');
  });
}

// ── Characters ────────────────────────────────────────────────────────────
function drawChar(x,y,cc,dir,hideAnim,throwCD,fat){
  const sq=Math.min(1,hideAnim);
  const bw=fat?20:14;
  const bodyH=Math.round((fat?38:36)-sq*(fat?22:18));
  const headY=y-bodyH-10;
  const armRaise=throwCD>0?Math.max(0,throwCD/12)*8:0;
  cx.fillStyle='rgba(0,0,0,0.14)';cx.beginPath();cx.ellipse(x,y+2,fat?18:14,4,0,0,Math.PI*2);cx.fill();
  // Beine
  if(sq<0.6){
    px(x-(bw/2+1),y-14+sq*10,fat?9:7,14-sq*6,cc.pants);
    px(x+3,y-14+sq*10,fat?9:7,14-sq*6,cc.pants);
    cx.fillStyle='#1a1008';cx.beginPath();cx.roundRect(x-(bw/2+2),y-3,fat?10:9,4,1);cx.fill();
    cx.fillStyle='#1a1008';cx.beginPath();cx.roundRect(x+2,y-3,fat?10:9,4,1);cx.fill();
  }else{
    px(x-(fat?14:10),y-10,fat?11:9,10,cc.pants);px(x+(fat?3:3),y-10,fat?11:9,10,cc.pants);
  }
  // Körper
  px(x-bw/2,y-bodyH-2,bw,bodyH+2,cc.shirt);
  // Glitzer (TEURICH)
  if(fat&&cc.glitter){
    cx.fillStyle='#ffd700';
    for(let s=0;s<10;s++){
      const gx=x-bw/2+3+Math.sin(s*137)*bw*0.45;
      const gy=y-bodyH+4+s*(bodyH-6)/10;
      cx.beginPath();cx.arc(gx,gy,1.5,0,Math.PI*2);cx.fill();
    }
    cx.fillStyle='rgba(255,215,0,0.3)';

function spawnHit(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:28,color:['#e8e0ca','#d4c8a0','#c0b080'][~~(Math.random()*3)]});}}
function spawnText(x,y,txt,color){particles.push({x,y,vx:(Math.random()-0.5)*2.5,vy:-1.8,life:70,color,text:txt,sz:13});}
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];cx.save();cx.globalAlpha=Math.max(0,p.life/(p.text?70:28));
    if(p.text){cx.fillStyle=p.color;cx.font=`bold ${p.sz||10}px Courier New`;cx.textAlign='center';cx.fillText(p.text,p.x,p.y);cx.textAlign='left';}
    else{cx.fillStyle=p.color;cx.fillRect(p.x-2,p.y-2,4,4);}
    cx.restore();p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;if(p.life<=0)particles.splice(i,1);
  }
}

  cx.fillStyle='#e8e8e0';cx.fillRect(x,y,w,h);
  cx.fillStyle='#1a1a1a';cx.font=`bold ${Math.round(h*0.62)}px serif`;
  cx.textAlign='center';cx.textBaseline='middle';cx.fillText('P',x+w/2,y+h*0.46);
  cx.restore();cx.save();_shieldClip(x,y,w,h);
  cx.strokeStyle='#606060';cx.lineWidth=1.5;cx.stroke();cx.restore();
}

// ── Splash Screen (+ team selection) ─────────────────────────────────────
function drawSplash(){
  blinkT++;
  // Background
  cx.fillStyle='#0a0e06';cx.fillRect(0,0,W,H);
  if(_splashImg){cx.drawImage(_splashImg,0,65,W,H-65);}
  cx.fillStyle='rgba(0,0,0,0.34)';cx.fillRect(0,65,W,H-65);
  for(let sy=0;sy<H;sy+=2){cx.fillStyle='rgba(0,0,0,0.22)';cx.fillRect(0,sy,W,1);}
  // ZX border
  const zxCols=['#ff0000','#ffff00','#00ffff','#00ff00','#ff00ff','#0000ff'];
  const bc=zxCols[Math.floor(blinkT/8)%zxCols.length];
  cx.strokeStyle=bc;cx.lineWidth=6;cx.strokeRect(6,6,W-12,H-12);
  cx.strokeStyle='rgba(0,0,0,0.6)';cx.lineWidth=2;cx.strokeRect(10,10,W-20,H-20);
  cx.globalAlpha=1;
  // Title
  cx.textAlign='center';
  const titleY=38;
  cx.fillStyle='#000000';cx.fillRect(W/2-220,titleY-26,440,38);
  cx.fillStyle='#00ffff';cx.font='bold 28px "Courier New",monospace';
  cx.fillText('LENINPLATZ  1987',W/2,titleY);
  cx.fillStyle='#000000';cx.fillRect(W/2-200,titleY+10,400,20);
  cx.fillStyle='#c8a030';cx.font='13px "Courier New",monospace';
  cx.fillText('Vorwärts immer, rückwärts nimmer!',W/2,titleY+24);
  // Team selection header
  cx.fillStyle='#a8c878';cx.font='bold 12px "Courier New",monospace';
  cx.fillText('── WÄHLE DEINE SEITE ──',W/2,80);
  // Side cards
  drawSideCard(120,148,160,120,'s',humanSide==='s');
  drawSideCard(440,148,160,120,'p',humanSide==='p');
  // Blinking selection arrow
  const ax=humanSide==='s'?200:520;
  if(Math.floor(blinkT/15)%2===0){
    cx.fillStyle=humanSide==='s'?'#d4a820':'#909090';
    cx.font='16px "Courier New",monospace';cx.fillText('▼',ax,84);
  }
  // Controls hint
  cx.textAlign='center';
  cx.fillStyle='#000';cx.fillRect(W/2-230,278,460,18);
  cx.fillStyle='#607848';cx.font='11px "Courier New",monospace';
  cx.fillText('← → Seite wählen    LEERTASTE Starten',W/2,292);
  cx.textAlign='left';
}

// ── Select Screen ─────────────────────────────────────────────────────────
let blinkT=0;
function drawSideCard(x,y,w,h,side,sel){
  const ac=side==='s'?'#d4a820':'#909090',bg=side==='s'?'#1a1408':'#101010';
  cx.shadowColor='rgba(0,0,0,0.7)';cx.shadowBlur=14;cx.shadowOffsetX=4;cx.shadowOffsetY=5;
  rr(x,y,w,h,4,bg,sel?ac:'#304028');
  cx.shadowColor='transparent';cx.shadowBlur=0;cx.shadowOffsetX=0;cx.shadowOffsetY=0;
  cx.textAlign='center';cx.fillStyle=sel?ac:'#607848';cx.font='bold 20px Courier New';cx.fillText(side==='s'?'SACHSEN':'PREUßEN',x+w/2,y+32);
  const ww=72,wh=86;const wx=x+w/2-ww/2,wy=y+42;
  if(side==='s')drawWappenSachsen(wx,wy,ww,wh);
  else drawWappenPreussen(wx,wy,ww,wh);
  cx.fillStyle=sel?(side==='s'?'#c0392b':'#2c6a9a'):'#606050';cx.font='bold 11px Courier New';cx.fillText(side===humanSide?'[ DU ]':'[ KI ]',x+w/2,y+h-10);
  cx.textAlign='left';
}

// ── Game Over ─────────────────────────────────────────────────────────────
function drawGameOver(){
  cx.fillStyle='rgba(0,0,0,0.78)';cx.fillRect(0,0,W,H);cx.textAlign='center';
  const hw=winner===humanSide;
  cx.fillStyle=hw?'#c8a030':'#6a6a60';cx.font='bold 36px Courier New';cx.fillText(hw?'SIEG!':'NIEDERLAGE',W/2,140);
  cx.font='16px Courier New';cx.fillStyle='#a8c060';
  const sn=humanSide==='s'?'Sachsen':'Preußen',cn=humanSide==='s'?'Preußen':'Sachsen';
  cx.fillText(hw?`${sn} gewinnt!`:`${cn} (KI) gewinnt!`,W/2,180);
  const sS=parseInt(document.getElementById('scoreS').textContent);
  const sP=parseInt(document.getElementById('scoreP').textContent);
  cx.font='13px Courier New';cx.fillStyle='#6a8040';cx.fillText(`Sachsen: ${sS}   |   Preußen: ${sP}`,W/2,214);
  if(Math.floor(frame/20)%2===0){cx.fillStyle='#485030';cx.font='11px Courier New';cx.fillText('[ LEERTASTE oder WERFEN-Taste für neues Spiel ]',W/2,270);}
  cx.textAlign='left';
}

// ── CPU AI ─────────────────────────────────────────────────────────────────
function updateCPU(){
  const cpu=players[cpuSide];cpu.vx=0;
  const dang=pillows.filter(p=>{
    const toward=cpuSide==='s'?p.vx<0:p.vx>0;
    return toward&&p.owner!==cpuSide&&Math.abs(p.x-cpu.x)<220;
  });
  if(dang.length>0){
    const pil=dang[0];if(Math.abs(pil.x-cpu.x)<120){cpu.vx=(pil.x<cpu.x)?2.5:-2.5;cpu.dir=cpu.vx>0?1:-1;}
    if(cpu.onGround&&Math.abs(pil.x-cpu.x)<80&&Math.random()<0.025){cpu.vy=-8;cpu.onGround=false;}
  }else{
    cpuMoveClock--;if(cpuMoveClock<=0){cpuMoveDir=(Math.random()-0.5)*2.8;cpuMoveClock=50+Math.random()*60;}
    cpu.vx=cpuMoveDir;cpu.dir=cpuSide==='s'?1:-1;
  }
  if(activeEvent&&activeEvent.type==='carmen'&&activeEvent.phase==='patrol'){
    const bedCX=cpuSide==='s'?109:611;
    if(!isOnBed(cpu)){
      if(Math.abs(cpu.x-bedCX)>25)cpu.vx=(cpu.x<bedCX?1:-1)*2.8;
      if(cpu.onGround&&Math.random()<0.06){cpu.vy=-8;cpu.onGround=false;}
    }
    cpuHideKey=false;cpu.hideAnim=Math.max(0,cpu.hideAnim-0.08);cpu.hiding=false;
  }else{
    if(activeEvent&&activeEvent.phase==='patrol'){if(Math.random()<0.04)cpuHideKey=true;}
    else if(!activeEvent)cpuHideKey=false;
    if(cpuHideKey&&cpu.onGround){cpu.hideAnim=Math.min(1,cpu.hideAnim+0.1);cpu.hiding=cpu.hideAnim>0.5;}
    else{cpu.hideAnim=Math.max(0,cpu.hideAnim-0.08);cpu.hiding=false;}
  }
  cpuThrowTimer--;
  if(cpuThrowTimer<=0&&!cpu.hiding){
    cpu.dir=cpuSide==='s'?1:-1;throwPillow(cpu);cpuThrowTimer=70+Math.random()*80;
  }
}

// ── Input ──────────────────────────────────────────────────────────────────
function handleHuman(){
  const p=players[humanSide];p.vx=0;
  if(K['ArrowLeft']&&!p.hiding){p.vx=-2.8;p.dir=-1;}
  if(K['ArrowRight']&&!p.hiding){p.vx=2.8;p.dir=1;}
  if(K['Space']&&!p.hiding&&p.throwCD<=0)throwPillow(p);
  if(K['ArrowUp']&&p.onGround&&!p.hiding){p.vy=-8;p.onGround=false;}
  if(K['ArrowDown']&&p.onGround){p.hideAnim=Math.min(1,p.hideAnim+0.1);p.hiding=p.hideAnim>0.5;}
  else if(p.onGround){p.hideAnim=Math.max(0,p.hideAnim-0.08);p.hiding=false;}
}
function throwPillow(plr){
  pillows.push({x:plr.x+plr.dir*10,y:plr.y-28,vx:plr.dir*5.8,vy:-3.2,owner:plr.side,spin:0,spinV:plr.dir*0.18,life:180});
  plr.throwCD=30;shake=4;playSound('pillow');
}

// ── Physics ────────────────────────────────────────────────────────────────
function updatePhysics(){
  for(const plr of Object.values(players)){
    plr.x+=plr.vx;
    plr.y+=plr.vy;plr.vy+=0.45;
    const b=BEDS[plr.side];
    if(plr.vy>0&&!plr.onGround&&plr.y>=FLOOR-BED_H&&plr.x>=b.x1&&plr.x<=b.x2){
      plr.y=FLOOR-BED_H;plr.vy=0;plr.onGround=true;
    }else if(plr.y>=FLOOR){plr.y=FLOOR;plr.vy=0;plr.onGround=true;}
    else plr.onGround=false;
    if(plr.side==='s')plr.x=Math.max(20,Math.min(W/2-22,plr.x));
    else plr.x=Math.max(W/2+22,Math.min(W-20,plr.x));
    if(plr.throwCD>0)plr.throwCD--;if(plr.hitFlash>0)plr.hitFlash--;
  }
  for(let i=pillows.length-1;i>=0;i--){
    const pil=pillows[i];
    pil.x+=pil.vx;pil.y+=pil.vy;pil.vy+=0.28;pil.spin+=pil.spinV;pil.life--;
    if(pil.y>FLOOR-8){pil.y=FLOOR-8;pil.vy*=-0.42;pil.vx*=0.9;pil.spinV*=0.65;}
    // Außenwände: abprallen
    if(pil.x<10){pil.x=10;pil.vx=Math.abs(pil.vx)*0.75;playSound('pillow');}
    if(pil.x>W-10){pil.x=W-10;pil.vx=-Math.abs(pil.vx)*0.75;playSound('pillow');}
    // KEIN Abprallen an der Trennwand — Kissen können durchfliegen!
    if(pil.life<=0){pillows.splice(i,1);continue;}
    for(const plr of Object.values(players)){
      if(plr.side===pil.owner)continue;
      const dx=plr.x-pil.x,dy=(plr.y-22)-pil.y;
      if(Math.abs(dx)<18&&Math.abs(dy)<24){
        const pts=plr.hiding?2:5;
        const sc=plr.side==='s'?'scoreP':'scoreS';
        const ws=plr.side==='s'?'p':'s';
        const newScore=parseInt(document.getElementById(sc).textContent)+pts;
        document.getElementById(sc).textContent=newScore;
        spawnText(plr.x,plr.y-44,`+${pts}`,ws==='s'?'#d4a820':'#909090');
        plr.hitFlash=20;spawnHit(pil.x,pil.y,10);pillows.splice(i,1);
        if(newScore>=WIN_SCORE){winner=ws;state=ST.OVER;frame=0;}
        break;
      }
    }
  }
}

// ── Events ─────────────────────────────────────────────────────────────────
function updateEvent(){
  nextEvent--;
  if(!activeEvent&&nextEvent<=0){
    const types=['abv','hausmeister','carmen','teurich','winkler','hancke'];
    const t=types[~~(Math.random()*types.length)];
    const fromRight=t==='carmen'||(t==='winkler'||t==='hancke')&&Math.random()>0.5;
    activeEvent={type:t,progress:0,phase:'enter',x:fromRight?W+50:-60,dir:fromRight?-1:1,floodY:0};
    nextEvent=450+Math.random()*550;eventWarnAge=110;
    playSound(t==='teurich'?'teurich':t==='abv'?'abv':t==='hausmeister'?'hausmeister':t==='winkler'||t==='hancke'?'hausmeister':'carmen');
  }
  if(eventWarnAge>0)eventWarnAge--;
  if(!activeEvent)return;
  const ev=activeEvent;
  ev.progress=Math.min(1,ev.progress+0.003);
  const spd=ev.type==='carmen'?4.8:ev.type==='teurich'?1.5:ev.type==='hancke'?1.8:2.4;
  ev.x+=ev.dir*spd*(ev.phase==='exit'?1.6:1);
  if(ev.phase==='enter'&&ev.progress>0.42)ev.phase='patrol';
  if(ev.phase==='patrol'&&ev.progress>0.68)ev.phase='exit';
  if(ev.type==='carmen'&&ev.phase==='patrol'){ev.floodY=Math.min(1,ev.floodY+0.01);floodLevel=ev.floodY;}
  if(ev.phase==='exit'&&(ev.x<-100||ev.x>W+100)){
    const penalty=ev.type==='teurich'?10:ev.type==='hancke'?8:5;
    for(const plr of Object.values(players)){
      const safe=ev.type==='carmen'?isOnBed(plr):(plr.hiding&&plr.hideAnim>=0.55);
      if(!safe){
        const sc=plr.side==='s'?'scoreS':'scoreP';
        const newScore=Math.max(0,parseInt(document.getElementById(sc).textContent)-penalty);
        document.getElementById(sc).textContent=newScore;
        spawnText(plr.x,plr.y-44,`−${penalty}`,'#e74c3c');spawnHit(plr.x,plr.y-20,6);
      }
    }
    if(ev.type==='carmen'){let t=setInterval(()=>{floodLevel=Math.max(0,floodLevel-0.015);if(floodLevel<=0)clearInterval(t);},60);}
    activeEvent=null;
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function draw(){
  cx.save();
  if(shake>0)cx.translate(Math.random()*shake-shake/2,Math.random()*shake-shake/2);
  if(state===ST.SPLASH){
    drawSplash();
  }else{
    drawRoom();
    for(const pil of pillows)drawPillow(pil);
    for(const plr of Object.values(players)){
      cx.save();
      if(plr.hitFlash>0)cx.globalAlpha=0.45+0.55*Math.sin(plr.hitFlash*0.7);
      const fat=false; // players aren't fat
      drawChar(plr.x,plr.y,CC[plr.side],plr.dir,plr.hideAnim,plr.throwCD,false);
      cx.restore();
    }
    if(activeEvent){
      if(activeEvent.type==='abv')drawABV(activeEvent);
      else if(activeEvent.type==='hausmeister')drawHausmeister(activeEvent);
      else if(activeEvent.type==='carmen')drawCarmen(activeEvent);
      else if(activeEvent.type==='winkler')drawWinkler(activeEvent);
      else if(activeEvent.type==='hancke')drawHancke(activeEvent);
      else drawTeurich(activeEvent);
    }
    drawFlood();drawParticles();
    for(const plr of Object.values(players))drawHideBar(plr);
    if(eventWarnAge>0&&activeEvent){
      const wt={abv:'⚠  ABV − DEIN FREUND UND HELFER!',hausmeister:'⚠  HAUSMEISTER!',carmen:'⚠  CARMEN + ÜBERSCHWEMMUNG!',teurich:'⚠  HEIMLEITERIN TEURICH!',winkler:'⚠  HERR WINKLER!',hancke:'⚠  HERR HANCKE!'};
      const wc={abv:'rgba(55,55,50,0.92)',hausmeister:'rgba(20,50,120,0.92)',carmen:'rgba(15,50,130,0.92)',teurich:'rgba(80,10,80,0.92)',winkler:'rgba(30,70,30,0.92)',hancke:'rgba(50,30,10,0.92)'};
      const ws={abv:'Schnell ducken! (↓)',hausmeister:'Schnell ducken! (↓)',carmen:'Auf das Bett springen! (↑)',teurich:'SCHNELL DUCKEN! − DOPPELTE STRAFE!',winkler:'Schnell ducken! (↓)',hancke:'Schnell ducken! − SCHWERER KERL!'};
      drawWarning(wt[activeEvent.type],wc[activeEvent.type],ws[activeEvent.type]);
    }
    if(state===ST.OVER)drawGameOver();
  }
  cx.restore();
}

// ── Loop ────────────────────────────────────────────────────────────────────
function loop(){
  frame++;if(shake>0)shake-=0.35;
  if(state===ST.PLAY){handleHuman();updateCPU();updatePhysics();updateEvent();}
  draw();requestAnimationFrame(loop);
}
loop();
</script>
