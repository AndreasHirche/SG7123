<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Leninplatz 1987</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e08;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;font-family:'Courier New',monospace;color:#d4c89a;overflow:hidden;user-select:none;touch-action:none}
canvas{border:3px solid #5a4a28;border-radius:2px;display:block;max-width:100vw;max-height:60dvh;width:auto;height:auto}
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:720px;padding:5px 14px;background:#0a0a06;border:2px solid #5a4a28;border-bottom:none;border-radius:3px 3px 0 0;font-size:0.78rem;letter-spacing:0.08em}
#info{max-width:720px;width:100%;padding:3px 14px;background:#0a0a06;border:2px solid #5a4a28;border-top:1px solid #1e1a0e;border-radius:0 0 3px 3px;font-size:0.62rem;color:#6a5e3a;text-align:center;letter-spacing:0.08em}
.pts-s{color:#c0392b;font-weight:700;font-size:0.82rem}
.pts-p{color:#2c6a9a;font-weight:700;font-size:0.82rem}
#title-bar{color:#c8b060;font-size:0.72rem;text-align:center;flex:1;letter-spacing:0.15em}
#touch-ctrl{display:none;width:100%;max-width:720px;padding:8px 6px;gap:6px;justify-content:space-between}
#tc-move,#tc-act{display:flex;gap:6px;align-items:center}
.tc{flex:none;width:clamp(58px,16vw,88px);height:clamp(58px,16vw,88px);background:#1a1408;border:2px solid #5a4a28;border-radius:8px;color:#c8b060;font-family:'Courier New',monospace;font-size:0.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
.tc:active,.tc.on{background:#3a2808;border-color:#c8a030}
@media(pointer:coarse){#touch-ctrl{display:flex}#info{display:none}}
@media(pointer:coarse) and (orientation:landscape){
  body{flex-direction:row;overflow:hidden;align-items:center}
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;max-width:none;border-radius:0;border-left:none;border-right:none;font-size:0.6rem;padding:2px 8px}
  canvas{height:calc(100dvh - 28px);width:auto;max-height:calc(100dvh - 28px);max-width:calc(100vw - 158px);border:none;margin-top:28px;flex-shrink:0}
  #touch-ctrl{display:contents!important}
  #tc-move{display:flex!important;flex-direction:column;gap:8px;width:72px;height:100dvh;align-items:center;justify-content:center;flex-shrink:0;order:-1}
  #tc-act{display:flex!important;flex-direction:column;gap:6px;width:86px;height:100dvh;align-items:center;justify-content:center;flex-shrink:0;order:1}
  .tc{width:64px;height:clamp(44px,11dvh,66px);font-size:0.72rem;border-radius:10px}
}
</style>
</head>
<body>
<div id="hud">
  <span class="pts-s">SACHSEN: <span id="scoreS">0</span></span>
  <span id="title-bar">✦ LENINPLATZ 1987 ✦</span>
  <span class="pts-p">PREUSSEN: <span id="scoreP">0</span></span>
</div>
<canvas id="c" width="720" height="400"></canvas>
<div id="info">← → Bewegen &nbsp;|&nbsp; LEERTASTE Werfen &nbsp;|&nbsp; ↑ Springen &nbsp;|&nbsp; ↓ Ducken</div>
<div id="touch-ctrl">
  <div id="tc-move">
    <button class="tc" id="tc-l">←</button>
    <button class="tc" id="tc-r">→</button>
  </div>
  <div id="tc-act">
    <button class="tc" id="tc-up">↑</button>
    <button class="tc" id="tc-w">Werfen</button>
    <button class="tc" id="tc-s">↓</button>
  </div>
</div>

<script>
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const W=720, H=400, FLOOR=H-62, WALL_SPLIT=FLOOR-155;

// ── Audio ─────────────────────────────────────────────────────────────────
let _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function playSound(type){
  try{
    const a=ac(),g=a.createGain(),now=a.currentTime;
    g.connect(a.destination);
    const o=()=>{const x=a.createOscillator();x.connect(g);return x;};
    if(type==='pillow'){
      const buf=a.createBuffer(1,a.sampleRate*0.12,a.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*0.025));
      const src=a.createBufferSource();src.buffer=buf;
      const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=350;
      src.connect(lp);lp.connect(g);
      g.gain.setValueAtTime(0.55,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);src.start();
    }else if(type==='abv'){
      // tatütata siren
      const os=o();os.type='sawtooth';
      [880,660,880,660,880,660].forEach((f,i)=>os.frequency.setValueAtTime(f,now+i*0.22));
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+1.4);
      os.start(now);os.stop(now+1.45);
    }else if(type==='hausmeister'){
      const os=o();os.type='triangle';
      os.frequency.setValueAtTime(850,now);os.frequency.exponentialRampToValueAtTime(550,now+0.09);
      g.gain.setValueAtTime(0.45,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);
      os.start(now);os.stop(now+0.4);
    }else if(type==='carmen'){
      const os=o();os.type='sine';
      os.frequency.setValueAtTime(480,now);os.frequency.linearRampToValueAtTime(820,now+0.4);os.frequency.linearRampToValueAtTime(620,now+0.8);
      g.gain.setValueAtTime(0.16,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.9);
      os.start(now);os.stop(now+1);
    }else if(type==='teurich'){
      const os=o();os.type='sawtooth';
      const lp=a.createBiquadFilter();lp.type='bandpass';lp.frequency.value=220;lp.Q.value=3;
      os.disconnect();os.connect(lp);lp.connect(g);
      os.frequency.setValueAtTime(110,now);os.frequency.exponentialRampToValueAtTime(55,now+0.55);
      g.gain.setValueAtTime(0.55,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.65);
      os.start(now);os.stop(now+0.7);
    }
  }catch(e){}
}

// ── Keys ─────────────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(state===ST.SPLASH){state=ST.SELECT;e.preventDefault();return;}
  if(state===ST.SELECT){
    if(e.code==='ArrowLeft'||e.code==='ArrowRight'){humanSide=humanSide==='s'?'p':'s';cpuSide=humanSide==='s'?'p':'s';}
    if(e.code==='Enter'||e.code==='Space'){startGame();e.preventDefault();}
  }else if(state===ST.OVER&&(e.code==='Enter'||e.code==='Space')){state=ST.SELECT;}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>K[e.code]=false);

// Touch controls
['tc-l','tc-r','tc-w','tc-s','tc-up'].forEach(id=>{
  const btn=document.getElementById(id);if(!btn)return;
  const code={'tc-l':'ArrowLeft','tc-r':'ArrowRight','tc-w':'Space','tc-s':'ArrowDown','tc-up':'ArrowUp'}[id];
  btn.addEventListener('touchstart',e=>{K[code]=true;btn.classList.add('on');e.preventDefault();if(state===ST.SPLASH){state=ST.SELECT;return;}if(state===ST.SELECT){humanSide=id==='tc-l'?'s':'p';cpuSide=humanSide==='s'?'p':'s';}},{passive:false});
  btn.addEventListener('touchend',e=>{K[code]=false;btn.classList.remove('on');if(state===ST.SELECT&&id==='tc-w'){startGame();}e.preventDefault();},{passive:false});
});

// ── State ─────────────────────────────────────────────────────────────────
const ST={SPLASH:'splash',SELECT:'select',PLAY:'play',OVER:'over'};
let state=ST.SPLASH,humanSide='s',cpuSide='p',winner='';

// ── Colors ────────────────────────────────────────────────────────────────
const C={wallHi:'#d0c9b2',wallLoS:'#7a3a28',wallLoP:'#2a5a7a',ceiling:'#b8b2a0',floor:'#8a6a40',floorDk:'#6a5030',divide:'#282820'};
const CC={
  s:  {skin:'#f0c898',hair:'#2a1000',shirt:'#1a4a8a',pants:'#2c3020',tie:'#c0392b'},
  p:  {skin:'#e8c090',hair:'#180800',shirt:'#1a4a8a',pants:'#303838',tie:'#2c6a9a'},
  abv:{skin:'#f0d8b0',hair:'#1e1e1e',shirt:'#7a7a6a',pants:'#5a5a4a'},
  jan:{skin:'#c89060',hair:'#5a3010',shirt:'#2a5a9a',pants:'#1e3a6e'},
  carmen:{skin:'#f0c8a0',hair:'#101010'},
  teurich:{skin:'#f0c8b0',hair:'#c0392b',shirt:'#9a60c0',pants:'#3a3050'},
};
const WIN_SCORE=40;

// ── Game objects ──────────────────────────────────────────────────────────
let players,pillows,particles,activeEvent,nextEvent,frame,shake,floodLevel;
let cpuThrowTimer,cpuMoveDir,cpuMoveClock,cpuHideKey=false,eventWarnAge=0;

function startGame(){
  state=ST.PLAY;cpuSide=humanSide==='s'?'p':'s';
  players={
    s:{x:160,y:FLOOR,vx:0,vy:0,onGround:true,dir:1,hiding:0,hideAnim:0,throwCD:0,hitFlash:0,side:'s'},
    p:{x:560,y:FLOOR,vx:0,vy:0,onGround:true,dir:-1,hiding:0,hideAnim:0,throwCD:0,hitFlash:0,side:'p'},
  };
  pillows=[];particles=[];activeEvent=null;floodLevel=0;frame=0;shake=0;
  nextEvent=500+Math.random()*600;
  cpuThrowTimer=80+Math.random()*80;cpuMoveDir=0;cpuMoveClock=0;cpuHideKey=false;
  document.getElementById('scoreS').textContent='0';
  document.getElementById('scoreP').textContent='0';
}

// ── Drawing helpers ───────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke){
  cx.beginPath();cx.roundRect(x,y,w,h,r);
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke();}
}
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}

// ── Room ──────────────────────────────────────────────────────────────────
function drawRoom(){
  px(0,0,W,16,C.ceiling);
  cx.fillStyle='rgba(255,255,220,0.65)';cx.fillRect(W/4,3,W/2,6);
  cx.fillStyle='rgba(255,255,220,0.07)';cx.fillRect(0,0,W,30);

  function wall(x,w,lo){
    px(x,16,w,WALL_SPLIT-16,C.wallHi);
    px(x,WALL_SPLIT,w,FLOOR-WALL_SPLIT,lo);
    cx.strokeStyle='rgba(0,0,0,0.09)';cx.lineWidth=1;
    for(let jy=40;jy<FLOOR;jy+=55){cx.beginPath();cx.moveTo(x,jy);cx.lineTo(x+w,jy);cx.stroke();}
    for(let jx=x;jx<x+w;jx+=72){cx.beginPath();cx.moveTo(jx,16);cx.lineTo(jx,FLOOR);cx.stroke();}
    px(x,FLOOR-5,w,5,'#3a2a18');
  }
  wall(0,W/2,C.wallLoS);
  wall(W/2,W/2,C.wallLoP);


  const fp=cx.createLinearGradient(0,FLOOR,0,H);
  fp.addColorStop(0,C.floor);fp.addColorStop(1,C.floorDk);
  cx.fillStyle=fp;cx.fillRect(0,FLOOR,W,H-FLOOR);
  cx.strokeStyle='rgba(0,0,0,0.07)';cx.lineWidth=1;
  for(let fx=0;fx<W;fx+=40){cx.beginPath();cx.moveTo(fx,FLOOR);cx.lineTo(fx,H);cx.stroke();}

  drawWin(75,55,78,88,C.wallLoS);drawWin(568,55,78,88,C.wallLoP);
  drawBed(55,FLOOR,'left','#8a2a1a');drawBed(548,FLOOR,'right','#1a4a6a');
  drawPoster(130,80,52,38,'#8b1a0e','#f0c030','FDJ');
  drawPoster(158,82,48,34,'#1a3a08','#90c840','SPORT\nGES.');
  drawPoster(500,75,52,40,'#0a1a2e','#90b8d8','FRIEDEN');
  drawPoster(525,130,40,28,'#1e1e10','#c8c060','MARX');
  drawRadio(200,FLOOR);drawShelf(470,FLOOR-55);

  // Zimmer-Schriftzug
  cx.font='bold 32px Courier New';cx.textAlign='left';
  cx.fillStyle='rgba(0,0,0,0.45)';cx.fillText('ZIMMER S',16,WALL_SPLIT-12);
  cx.fillStyle='rgba(210,75,45,0.88)';cx.fillText('ZIMMER S',14,WALL_SPLIT-14);
  cx.fillStyle='rgba(0,0,0,0.45)';cx.fillText('ZIMMER P',W/2+16,WALL_SPLIT-12);
  cx.fillStyle='rgba(45,100,185,0.88)';cx.fillText('ZIMMER P',W/2+14,WALL_SPLIT-14);
  cx.textAlign='left';
}

function drawWin(x,y,w,h,cur){
  rr(x,y,w,h,2,'#b8b0a0','#808070');
  px(x+3,y+3,w-6,h-6,'#c8dde8');
  cx.fillStyle='rgba(255,255,255,0.55)';cx.beginPath();cx.arc(x+20,y+22,9,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(x+30,y+20,7,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#808070';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(x+3,y+h/2);cx.lineTo(x+w-3,y+h/2);cx.stroke();
  cx.beginPath();cx.moveTo(x+w/2,y+3);cx.lineTo(x+w/2,y+h-3);cx.stroke();
  cx.fillStyle=cur;cx.globalAlpha=0.35;cx.fillRect(x+3,y+3,10,h-6);cx.fillRect(x+w-13,y+3,10,h-6);cx.globalAlpha=1;
}
function drawBed(x,y,side,col){
  const w=108,h=32,bx=side==='left'?x:x-w;
  rr(bx,y-h,w,h,2,'#5a5040','#3a3028');rr(bx+4,y-h+3,w-8,h-8,2,'#c8bea0',null);
  rr(bx+6,y-h+4,30,18,2,'#e8e0cc','#b0a890');rr(bx+40,y-h+6,w-46,h-10,2,col,null);
  px(side==='left'?bx:bx+w-8,y-h-20,8,26,'#4a4030');
}
function drawPoster(x,y,w,h,bg,tc,t){
  rr(x,y,w,h,1,bg,'#1a1a10');cx.fillStyle=tc;cx.font='bold 7px Courier New';cx.textAlign='center';
  t.split('\n').forEach((l,i)=>cx.fillText(l,x+w/2,y+13+i*9));cx.textAlign='left';
}
function drawRadio(x,y){
  px(x-22,y-22,44,20,'#4a3a20');px(x-19,y-20,38,12,'#2a1a08');
  cx.strokeStyle='#3a2a10';cx.lineWidth=0.8;
  for(let r=0;r<5;r++){cx.beginPath();cx.moveTo(x-19,y-19+r*2);cx.lineTo(x,y-19+r*2);cx.stroke();}
  cx.fillStyle='#c8a030';cx.beginPath();cx.arc(x+12,y-14,5,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a0a00';cx.beginPath();cx.arc(x+12,y-14,2,0,Math.PI*2);cx.fill();
}
function drawShelf(x,y){
  px(x,y,60,5,'#5a4020');
  cx.fillStyle='#5a8c10';cx.fillRect(x+8,y-32,8,32); // bottle body – bigger
  cx.fillStyle='#3a6008';cx.fillRect(x+8,y-32,8,32);
  cx.fillStyle='#7ab020';cx.fillRect(x+8,y-38,8,8); // neck
  cx.fillStyle='#c0c0b0';cx.fillRect(x+9,y-40,6,4); // cap
  cx.fillStyle='rgba(220,255,100,0.35)';cx.fillRect(x+9,y-30,6,18);
  cx.fillStyle='#f0e060';cx.font='bold 5px Courier New';cx.textAlign='center';
  cx.fillText('PILSENER',x+12,y-20);cx.textAlign='left';
  [[x+20,'#2a4a6a',22],[x+32,'#4a2a0a',16],[x+40,'#2a3a1a',18]].forEach(([bx,bc,bw])=>{
    px(bx,y-26,bw,26,bc);px(bx+1,y-24,bw-2,2,'#ffffff22');
  });
}

// ── Characters ────────────────────────────────────────────────────────────
function drawChar(x,y,cc,dir,hideAnim,throwCD,fat){
  const sq=Math.min(1,hideAnim);
  const bw=fat?20:14;
  const bodyH=Math.round((fat?38:36)-sq*(fat?22:18));
  const headY=y-bodyH-10;
  const armRaise=throwCD>0?Math.max(0,throwCD/12)*8:0;
  cx.fillStyle='rgba(0,0,0,0.14)';cx.beginPath();cx.ellipse(x,y+2,fat?18:14,4,0,0,Math.PI*2);cx.fill();
  // Beine
  if(sq<0.6){
    px(x-(bw/2+1),y-14+sq*10,fat?9:7,14-sq*6,cc.pants);
    px(x+3,y-14+sq*10,fat?9:7,14-sq*6,cc.pants);
    cx.fillStyle='#1a1008';cx.beginPath();cx.roundRect(x-(bw/2+2),y-3,fat?10:9,4,1);cx.fill();
    cx.fillStyle='#1a1008';cx.beginPath();cx.roundRect(x+2,y-3,fat?10:9,4,1);cx.fill();
  }else{
    px(x-(fat?14:10),y-10,fat?11:9,10,cc.pants);px(x+(fat?3:3),y-10,fat?11:9,10,cc.pants);
  }
  // Körper
  px(x-bw/2,y-bodyH-2,bw,bodyH+2,cc.shirt);
  // Glitzer (TEURICH)
  if(fat&&cc.glitter){
    cx.fillStyle='#ffd700';
    for(let s=0;s<10;s++){
      const gx=x-bw/2+3+Math.sin(s*137)*bw*0.45;
      const gy=y-bodyH+4+s*(bodyH-6)/10;
      cx.beginPath();cx.arc(gx,gy,1.5,0,Math.PI*2);cx.fill();
    }
    cx.fillStyle='rgba(255,215,0,0.3)';
    cx.beginPath();cx.arc(x,y-bodyH/2-2,fat?12:0,0,Math.PI*2);cx.fill();
  }
  if(cc.tie){
    cx.fillStyle=cc.tie;cx.beginPath();
    cx.moveTo(x-bw/2,y-bodyH+2);cx.lineTo(x+bw/2,y-bodyH+2);cx.lineTo(x,y-bodyH+12);
    cx.closePath();cx.fill();
  }
  const armY=y-bodyH+2;
  const frontX=dir>0?x+bw/2:x-bw/2-5;
  const backX=dir>0?x-bw/2-5:x+bw/2;
  px(frontX,armY-armRaise,5,bodyH-4,cc.skin);px(backX,armY,5,bodyH-6,cc.shirt);
  // Kopf
  const headR=fat?10:8;
  cx.fillStyle=cc.skin;cx.beginPath();cx.arc(x,headY,headR,0,Math.PI*2);cx.fill();
  // Haare
  cx.fillStyle=cc.hair;
  if(fat){
    // kurze Haare: kleiner Bogen
    cx.beginPath();cx.arc(x,headY,headR,Math.PI*1.1,0);cx.fill();
    // kurze Strähnen
    for(let h=0;h<5;h++){const hx=x-headR+h*headR*0.5;cx.fillRect(hx,headY-headR,2,5);}
  }else{
    cx.beginPath();cx.arc(x,headY-2,headR,Math.PI,0);cx.fill();
  }
  cx.fillStyle='#1a0a00';cx.fillRect(x+dir*2,headY-1,2,2);
  cx.strokeStyle='#1a0a00';cx.lineWidth=1;
  cx.beginPath();cx.arc(x+dir*2,headY+4,3,0.3,Math.PI-0.3);cx.stroke();
}

// ── NPCs ──────────────────────────────────────────────────────────────────
function drawABV(ev){
  const x=ev.x,y=FLOOR;
  cx.save();cx.globalAlpha=ev.phase==='enter'?Math.min(1,ev.progress*5):Math.max(0,1-(ev.progress-0.65)*4);
  px(x-5,y-16,7,16,CC.abv.pants);px(x+2,y-16,7,16,CC.abv.pants);
  cx.fillStyle='#111';cx.beginPath();cx.roundRect(x-6,y-3,8,4,1);cx.fill();
  cx.fillStyle='#111';cx.beginPath();cx.roundRect(x+2,y-3,8,4,1);cx.fill();
  px(x-8,y-40,16,26,CC.abv.shirt);
  px(x-8,y-40,4,3,'#aaa');px(x+4,y-40,4,3,'#aaa');
  px(x-5,y-32,10,8,'#ddd');
  cx.fillStyle='#222';cx.font='bold 5px Courier New';cx.textAlign='center';cx.fillText('ABV',x,y-25);
  cx.fillStyle=CC.abv.skin;cx.beginPath();cx.arc(x,y-47,8,0,Math.PI*2);cx.fill();
  cx.fillStyle=CC.abv.hair;cx.beginPath();cx.arc(x,y-49,8,Math.PI,0);cx.fill();
  px(x-10,y-55,20,5,'#666');px(x-8,y-62,16,9,'#666');px(x-11,y-56,22,2,'#555');
  cx.strokeStyle='#7a5a10';cx.lineWidth=3;cx.lineCap='round';
  cx.beginPath();cx.moveTo(x+8,y-36);cx.lineTo(x+20,y-18);cx.stroke();
  cx.textAlign='left';cx.restore();
}

function drawHausmeister(ev){
  const x=ev.x,y=FLOOR,cc=CC.jan;
  cx.save();cx.globalAlpha=ev.phase==='enter'?Math.min(1,ev.progress*5):Math.max(0,1-(ev.progress-0.65)*4);
  px(x-5,y-16,7,16,cc.pants);px(x+2,y-16,7,16,cc.pants);
  cx.fillStyle='#1a1010';cx.beginPath();cx.roundRect(x-6,y-3,8,4,1);cx.fill();
  cx.fillStyle='#1a1010';cx.beginPath();cx.roundRect(x+2,y-3,8,4,1);cx.fill();
  px(x-8,y-40,16,26,cc.shirt); // blauer Kittel

function drawCarmen(ev){
  const x=ev.x,y=FLOOR,cc=CC.carmen;
  cx.save();cx.globalAlpha=ev.phase==='enter'?Math.min(1,ev.progress*6):Math.max(0,1-(ev.progress-0.55)*5);
  // Water stream BEHIND Carmen (opposite to movement direction)
  if(ev.progress>0.08){
    cx.strokeStyle='rgba(80,160,255,0.75)';cx.lineCap='round';
    for(let s=0;s<3;s++){
      cx.lineWidth=4-s;cx.beginPath();const len=110+s*50;
      for(let t=0;t<=len;t+=4){
        const wx=x+(-ev.dir)*(t+s*12),wy=(y-3-s*4)+Math.sin(t*0.16+frame*0.22+s*1.4)*(4-s);
        t===0?cx.moveTo(wx,wy):cx.lineTo(wx,wy);

  // Body
  cx.fillStyle='#c0392b';cx.beginPath();cx.moveTo(x-10,y);cx.lineTo(x-7,y-30);cx.lineTo(x+7,y-30);cx.lineTo(x+10,y);cx.closePath();cx.fill();

  px(x-5,y-40,10,12,'#d45040');

  cx.fillStyle=cc.skin;cx.beginPath();cx.arc(x,y-47,8,0,Math.PI*2);cx.fill();

  cx.fillStyle=cc.hair;cx.beginPath();cx.arc(x,y-49,8,Math.PI,0);cx.fill();
  cx.strokeStyle=cc.hair;cx.lineCap='round';
  [[9,y-51,0],[7,y-49,2],[5,y-53,4]].forEach(([lw,ys,si])=>{

// ── Wappen ────────────────────────────────────────────────────────────────
function drawWappenSachsen(x,y,w,h){
  // Classic Saxon shield: alternating black/gold horizontal bars (Barry of 10), green crancelin diagonal
  const bars=10;
  cx.save();
  // Shield clip (Heater shape)
  cx.beginPath();
  cx.moveTo(x,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h*0.65);
  cx.quadraticCurveTo(x+w,y+h*0.88,x+w/2,y+h);
  cx.quadraticCurveTo(x,y+h*0.88,x,y+h*0.65);
  cx.closePath();cx.clip();
  // Gold base
  cx.fillStyle='#f5c030';cx.fillRect(x,y,w,h);
  // Black horizontal bars (5 of them, alternating)
  const bh=h/bars;
  for(let b=0;b<bars;b+=2){cx.fillStyle='#1a1a1a';cx.fillRect(x,y+b*bh,w,bh);}
  // Green crancelin: diagonal strip with wavy edge
  cx.fillStyle='#2e7d32';
  cx.beginPath();cx.moveTo(x,y+h*0.25);cx.lineTo(x+w*0.12,y);cx.lineTo(x+w*0.42,y);cx.lineTo(x,y+h*0.55);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(x+w*0.58,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h*0.32);cx.lineTo(x+w*0.88,y+h*0.55);cx.lineTo(x+w,y+h*0.45);cx.lineTo(x+w,y+h*0.68);cx.lineTo(x+w*0.58,y+h);cx.lineTo(x+w*0.28,y+h);cx.lineTo(x+w*0.72,y+h*0.45);cx.lineTo(x+w*0.42,y+h*0.22);cx.lineTo(x+w*0.58,y);cx.closePath();cx.fill();
  // Outline
  cx.restore();cx.save();
  cx.beginPath();
  cx.moveTo(x,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h*0.65);
  cx.quadraticCurveTo(x+w,y+h*0.88,x+w/2,y+h);
  cx.quadraticCurveTo(x,y+h*0.88,x,y+h*0.65);
  cx.closePath();cx.strokeStyle='#888';cx.lineWidth=1.5;cx.stroke();
  cx.restore();
}
function drawWappenPreussen(x,y,w,h){
  // Prussian shield: silver/white field, black Hohenzollern eagle
  cx.save();
  cx.beginPath();
  cx.moveTo(x,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h*0.65);
  cx.quadraticCurveTo(x+w,y+h*0.88,x+w/2,y+h);
  cx.quadraticCurveTo(x,y+h*0.88,x,y+h*0.65);
  cx.closePath();cx.clip();
  cx.fillStyle='#dde0dd';cx.fillRect(x,y,w,h);
  // Eagle body (simplified heraldic)
  const ex=x+w/2,ey=y+h*0.46,er=h*0.28;
  cx.fillStyle='#1a1a1a';
  cx.beginPath();cx.ellipse(ex,ey,er*0.42,er*0.55,0,0,Math.PI*2);cx.fill();
  // Wings
  cx.beginPath();
  cx.moveTo(ex-er*0.38,ey-er*0.15);cx.bezierCurveTo(ex-er*1.1,ey-er*0.6,ex-er*0.9,ey-er*1.0,ex-er*0.22,ey-er*0.5);
  cx.bezierCurveTo(ex-er*0.55,ey-er*0.75,ex-er*0.6,ey-er*0.5,ex-er*0.38,ey-er*0.15);
  cx.fill();
  cx.beginPath();
  cx.moveTo(ex+er*0.38,ey-er*0.15);cx.bezierCurveTo(ex+er*1.1,ey-er*0.6,ex+er*0.9,ey-er*1.0,ex+er*0.22,ey-er*0.5);
  cx.bezierCurveTo(ex+er*0.55,ey-er*0.75,ex+er*0.6,ey-er*0.5,ex+er*0.38,ey-er*0.15);
  cx.fill();
  // Tail feathers
  cx.beginPath();cx.moveTo(ex-er*0.22,ey+er*0.5);cx.lineTo(ex,ey+er*0.95);cx.lineTo(ex+er*0.22,ey+er*0.5);cx.fill();
  // Head + crown
  cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(ex,ey-er*0.65,er*0.22,0,Math.PI*2);cx.fill();
  // Beak (red)
  cx.fillStyle='#c0392b';cx.beginPath();cx.moveTo(ex+er*0.12,ey-er*0.6);cx.lineTo(ex+er*0.38,ey-er*0.68);cx.lineTo(ex+er*0.12,ey-er*0.52);cx.closePath();cx.fill();
  // Crown (gold)
  cx.fillStyle='#d4a820';
  cx.beginPath();cx.moveTo(ex-er*0.18,ey-er*0.85);cx.lineTo(ex-er*0.18,ey-er*1.05);cx.lineTo(ex-er*0.07,ey-er*0.95);cx.lineTo(ex,ey-er*1.12);cx.lineTo(ex+er*0.07,ey-er*0.95);cx.lineTo(ex+er*0.18,ey-er*1.05);cx.lineTo(ex+er*0.18,ey-er*0.85);cx.closePath();cx.fill();
  // Talons (red)
  cx.fillStyle='#c0392b';
  cx.beginPath();cx.moveTo(ex-er*0.14,ey+er*0.95);cx.lineTo(ex-er*0.28,ey+er*1.1);cx.lineTo(ex-er*0.06,ey+er*1.05);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(ex+er*0.14,ey+er*0.95);cx.lineTo(ex+er*0.28,ey+er*1.1);cx.lineTo(ex+er*0.06,ey+er*1.05);cx.closePath();cx.fill();
  cx.restore();cx.save();
  cx.beginPath();
  cx.moveTo(x,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h*0.65);
  cx.quadraticCurveTo(x+w,y+h*0.88,x+w/2,y+h);
  cx.quadraticCurveTo(x,y+h*0.88,x,y+h*0.65);
  cx.closePath();cx.strokeStyle='#888';cx.lineWidth=1.5;cx.stroke();
  cx.restore();
}

  // ZX copyright line
  cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(0,H-28,W,28);
  cx.fillStyle='#c8c8c8';cx.font='10px "Courier New",monospace';

  const sn=humanSide==='s'?'Sachsen':'Preußen',cn=humanSide==='s'?'Preußen':'Sachsen';
  cx.fillText(hw?`${sn} gewinnt!`:`${cn} (KI) gewinnt!`,W/2,180);
  const sS=parseInt(document.getElementById('scoreS').textContent);
  const sP=parseInt(document.getElementById('scoreP').textContent);
  cx.font='13px Courier New';cx.fillStyle='#6a8040';cx.fillText(`Sachsen: ${sS}   |   Preußen: ${sP}`,W/2,214);
  if(Math.floor(frame/20)%2===0){cx.fillStyle='#485030';cx.font='11px Courier New';cx.fillText('[ ENTER oder WERFEN-Taste für neues Spiel ]',W/2,270);}
  cx.textAlign='left';
}

// ── CPU AI ─────────────────────────────────────────────────────────────────
function updateCPU(){
  const cpu=players[cpuSide];cpu.vx=0;
  const dang=pillows.filter(p=>{
    const toward=cpuSide==='s'?p.vx<0:p.vx>0;
    return toward&&p.owner!==cpuSide&&Math.abs(p.x-cpu.x)<220;
  });
  if(dang.length>0){
    const pil=dang[0];if(Math.abs(pil.x-cpu.x)<120){cpu.vx=(pil.x<cpu.x)?2.5:-2.5;cpu.dir=cpu.vx>0?1:-1;}
    if(cpu.onGround&&Math.abs(pil.x-cpu.x)<80&&Math.random()<0.025){cpu.vy=-8;cpu.onGround=false;}
  }else{
    cpuMoveClock--;if(cpuMoveClock<=0){cpuMoveDir=(Math.random()-0.5)*2.8;cpuMoveClock=50+Math.random()*60;}
    cpu.vx=cpuMoveDir;cpu.dir=cpuSide==='s'?1:-1;
  }
  if(activeEvent&&activeEvent.phase==='patrol'){if(Math.random()<0.04)cpuHideKey=true;}
  else if(!activeEvent)cpuHideKey=false;
  if(cpuHideKey&&cpu.onGround){cpu.hideAnim=Math.min(1,cpu.hideAnim+0.1);cpu.hiding=cpu.hideAnim>0.5;}
  else{cpu.hideAnim=Math.max(0,cpu.hideAnim-0.08);cpu.hiding=false;}
  cpuThrowTimer--;
  if(cpuThrowTimer<=0&&!cpu.hiding){
    cpu.dir=cpuSide==='s'?1:-1;throwPillow(cpu);cpuThrowTimer=70+Math.random()*80;
  }
}

// ── Input ──────────────────────────────────────────────────────────────────
function handleHuman(){
  const p=players[humanSide];p.vx=0;
  if(K['ArrowLeft']&&!p.hiding){p.vx=-2.8;p.dir=-1;}
  if(K['ArrowRight']&&!p.hiding){p.vx=2.8;p.dir=1;}
  if(K['Space']&&!p.hiding&&p.throwCD<=0)throwPillow(p);
  if(K['ArrowUp']&&p.onGround&&!p.hiding){p.vy=-8;p.onGround=false;}
  if(K['ArrowDown']&&p.onGround){p.hideAnim=Math.min(1,p.hideAnim+0.1);p.hiding=p.hideAnim>0.5;}
  else if(p.onGround){p.hideAnim=Math.max(0,p.hideAnim-0.08);p.hiding=false;}
}
function throwPillow(plr){
  pillows.push({x:plr.x+plr.dir*10,y:plr.y-28,vx:plr.dir*5.8,vy:-3.2,owner:plr.side,spin:0,spinV:plr.dir*0.18,life:180});
  plr.throwCD=30;shake=4;playSound('pillow');
}

// ── Physics ────────────────────────────────────────────────────────────────
function updatePhysics(){
  for(const plr of Object.values(players)){
    plr.x+=plr.vx;
    plr.y+=plr.vy;plr.vy+=0.45;
    if(plr.y>=FLOOR){plr.y=FLOOR;plr.vy=0;plr.onGround=true;}else plr.onGround=false;
    if(plr.side==='s')plr.x=Math.max(20,Math.min(W/2-22,plr.x));
    else plr.x=Math.max(W/2+22,Math.min(W-20,plr.x));
    if(plr.throwCD>0)plr.throwCD--;if(plr.hitFlash>0)plr.hitFlash--;
  }
  for(let i=pillows.length-1;i>=0;i--){
    const pil=pillows[i];
    pil.x+=pil.vx;pil.y+=pil.vy;pil.vy+=0.28;pil.spin+=pil.spinV;pil.life--;
    if(pil.y>FLOOR-8){pil.y=FLOOR-8;pil.vy*=-0.42;pil.vx*=0.9;pil.spinV*=0.65;}
    // Außenwände: abprallen
    if(pil.x<10){pil.x=10;pil.vx=Math.abs(pil.vx)*0.75;playSound('pillow');}
    if(pil.x>W-10){pil.x=W-10;pil.vx=-Math.abs(pil.vx)*0.75;playSound('pillow');}
    // KEIN Abprallen an der Trennwand — Kissen können durchfliegen!
    if(pil.life<=0){pillows.splice(i,1);continue;}
    for(const plr of Object.values(players)){
      if(plr.side===pil.owner)continue;
      const dx=plr.x-pil.x,dy=(plr.y-22)-pil.y;
      if(Math.abs(dx)<18&&Math.abs(dy)<24){
        const pts=plr.hiding?2:5;
        const sc=plr.side==='s'?'scoreP':'scoreS';
        const ws=plr.side==='s'?'p':'s';
        const newScore=parseInt(document.getElementById(sc).textContent)+pts;
        document.getElementById(sc).textContent=newScore;
        spawnText(plr.x,plr.y-44,`+${pts}`,ws==='s'?'#c0392b':'#2c6a9a');
        plr.hitFlash=20;spawnHit(pil.x,pil.y,10);pillows.splice(i,1);
        if(newScore>=WIN_SCORE){winner=ws;state=ST.OVER;frame=0;}
        break;
      }
    }
  }
}

// ── Events ─────────────────────────────────────────────────────────────────
function updateEvent(){
  nextEvent--;
  if(!activeEvent&&nextEvent<=0){
    const types=['abv','hausmeister','carmen','teurich'];
    const t=types[~~(Math.random()*types.length)];
    activeEvent={type:t,progress:0,phase:'enter',x:t==='carmen'?W+50:-60,dir:t==='carmen'?-1:1,floodY:0};
    nextEvent=450+Math.random()*550;eventWarnAge=110;
    playSound(t==='teurich'?'teurich':t==='abv'?'abv':t==='hausmeister'?'hausmeister':'carmen');
  }
  if(eventWarnAge>0)eventWarnAge--;
  if(!activeEvent)return;
  const ev=activeEvent;
  ev.progress=Math.min(1,ev.progress+0.003);
  const spd=ev.type==='carmen'?4.8:ev.type==='teurich'?1.5:2.4;
  ev.x+=ev.dir*spd*(ev.phase==='exit'?1.6:1);
  if(ev.phase==='enter'&&ev.progress>0.42)ev.phase='patrol';
  if(ev.phase==='patrol'&&ev.progress>0.68)ev.phase='exit';
  if(ev.type==='carmen'&&ev.phase==='patrol'){ev.floodY=Math.min(1,ev.floodY+0.01);floodLevel=ev.floodY;}
  if(ev.phase==='exit'&&(ev.x<-100||ev.x>W+100)){
    const penalty=ev.type==='teurich'?10:5;
    for(const plr of Object.values(players)){
      if(!plr.hiding&&plr.hideAnim<0.55){
        const sc=plr.side==='s'?'scoreS':'scoreP';
        const newScore=Math.max(0,parseInt(document.getElementById(sc).textContent)-penalty);
        document.getElementById(sc).textContent=newScore;
        spawnText(plr.x,plr.y-44,`−${penalty}`,'#e74c3c');spawnHit(plr.x,plr.y-20,6);
      }
    }
    if(ev.type==='carmen'){let t=setInterval(()=>{floodLevel=Math.max(0,floodLevel-0.015);if(floodLevel<=0)clearInterval(t);},60);}
    activeEvent=null;
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function draw(){
  cx.save();
  if(shake>0)cx.translate(Math.random()*shake-shake/2,Math.random()*shake-shake/2);
  if(state===ST.SPLASH){
    drawSplash();
  }else if(state===ST.SELECT){
    drawSelectScreen();
  }else{
    drawRoom();
    for(const pil of pillows)drawPillow(pil);
    for(const plr of Object.values(players)){
      cx.save();
      if(plr.hitFlash>0)cx.globalAlpha=0.45+0.55*Math.sin(plr.hitFlash*0.7);
      const fat=false; // players aren't fat
      drawChar(plr.x,plr.y,CC[plr.side],plr.dir,plr.hideAnim,plr.throwCD,false);
      cx.restore();
    }
    if(activeEvent){
      if(activeEvent.type==='abv')drawABV(activeEvent);
      else if(activeEvent.type==='hausmeister')drawHausmeister(activeEvent);
      else if(activeEvent.type==='carmen')drawCarmen(activeEvent);
      else drawTeurich(activeEvent);
    }
    drawFlood();drawParticles();
    for(const plr of Object.values(players))drawHideBar(plr);
    if(eventWarnAge>0&&activeEvent){
      const wt={abv:'⚠  ABV-BEAUFTRAGTER!',hausmeister:'⚠  HAUSMEISTER!',carmen:'⚠  CARMEN + ÜBERSCHWEMMUNG!',teurich:'⚠  HEIMLEITERIN TEURICH!'};
      const wc={abv:'rgba(55,55,50,0.92)',hausmeister:'rgba(20,50,120,0.92)',carmen:'rgba(15,50,130,0.92)',teurich:'rgba(80,10,80,0.92)'};
      const ws={abv:'Schnell ducken! (S)',hausmeister:'Schnell ducken! (S)',carmen:'Schnell ducken! − DOPPELTE STRAFE!',teurich:'SCHNELL DUCKEN! − DOPPELTE STRAFE!'};
      drawWarning(wt[activeEvent.type],wc[activeEvent.type],ws[activeEvent.type]);
    }
    if(state===ST.OVER)drawGameOver();
  }
  cx.restore();
}

// ── Loop ────────────────────────────────────────────────────────────────────
function loop(){
  frame++;if(shake>0)shake-=0.35;
  if(state===ST.PLAY){handleHuman();updateCPU();updatePhysics();updateEvent();}
  draw();requestAnimationFrame(loop);
}
loop();
</script>
